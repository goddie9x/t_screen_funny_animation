name: t_screen_funny_animation
description: "TScreen funny animation"
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.2.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_overlay_window: ^0.4.1
  window_manager: ^0.3.9
  screen_retriever: ^0.1.9
  hotkey_manager: ^0.2.3
  shared_preferences: ^2.2.2
  sensors_plus: ^5.0.1
  image_picker: ^1.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 48
flutter:
  uses-material-design: true
  assets:
    - assets/icon/
