name: Flutter CICD

on:
  push:
    branches: [dev, main, staging, prod]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  PACKAGE_NAME: com.god.tscreenfunny

jobs:
  analyze:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  promote:
    needs: [analyze]
    if: |
      always() &&
      (needs.analyze.result == 'success' || needs.analyze.result == 'skipped') &&
      (github.ref_name == 'dev' || github.ref_name == 'main' || github.ref_name == 'staging')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Auto-promote branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SOURCE="${{ github.ref_name }}"
          case "$SOURCE" in
            dev) TARGET=main ;;
            main) TARGET=staging ;;
            staging) TARGET=prod ;;
            *) echo "No promotion from $SOURCE"; exit 0 ;;
          esac

          echo "Promote $SOURCE → $TARGET"
          git fetch origin

          if git ls-remote --exit-code --heads origin "$TARGET" >/dev/null 2>&1; then
            git checkout -B "$TARGET" "origin/$TARGET"
            git merge "$GITHUB_SHA" --no-edit -m "chore: auto-promote $SOURCE → $TARGET"
          else
            git checkout -B "$TARGET" "$GITHUB_SHA"
          fi

          git push origin "$TARGET"
          gh workflow run "Flutter CICD" --ref "$TARGET"

  windows:
    if: github.ref_name == 'staging' || github.ref_name == 'prod'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip release
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          if (-not (Test-Path $src)) { $src = "build\windows\runner\Release" }
          Compress-Archive -Path "$src\*" -DestinationPath "TScreenFunnyAnimation-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ github.ref_name }}
          path: TScreenFunnyAnimation-windows-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}-${{ github.ref_name }}
          name: ${{ github.ref_name == 'prod' && 'Official Release' || 'Beta Build' }} v1.0.${{ github.run_number }}
          prerelease: ${{ github.ref_name == 'staging' }}
          files: TScreenFunnyAnimation-windows-x64.zip

  android:
    if: github.ref_name == 'staging' || github.ref_name == 'prod'
    runs-on: ubuntu-latest
    environment: Prod
    env:
      PLAY_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Decode keystore
        env:
          LEGACY_KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          KEYSTORE="${KEYSTORE_B64:-$LEGACY_KEYSTORE_B64}"
          if [ -z "$KEYSTORE" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 (or KEYSTORE_BASE64) in environment Prod."
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > android/app/upload-keystore.jks
      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LEGACY_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          LEGACY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LEGACY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties << EOF
          storePassword=${STORE_PASSWORD:-$LEGACY_STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD:-$LEGACY_KEY_PASSWORD}
          keyAlias=${KEY_ALIAS:-${LEGACY_KEY_ALIAS:-upload}}
          storeFile=upload-keystore.jks
          EOF
      - run: flutter pub get
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ github.ref_name }}
          path: build/app/outputs/bundle/release/app-release.aab
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}-${{ github.ref_name }}
          name: ${{ github.ref_name == 'prod' && 'Official Release' || 'Beta Build' }} v1.0.${{ github.run_number }}
          prerelease: ${{ github.ref_name == 'staging' }}
          files: build/app/outputs/bundle/release/app-release.aab
      - name: Publish to Play Store
        if: github.ref_name == 'prod' && env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
          changesNotSentForReview: true
