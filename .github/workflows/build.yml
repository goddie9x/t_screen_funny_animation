name: Flutter CICD

on:
  push:
    branches: [main, staging, prod]

permissions:
  contents: write
  actions: write

jobs:
  # JOB 1: Tự động merge từ main sang staging
  auto-merge:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge main to staging
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout staging
          git merge origin/main --no-edit
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git staging

  # JOB 2: Build và tạo Release
  build:
    if: github.ref_name == 'staging' || github.ref_name == 'prod'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: Build APK
        run: |
          flutter pub get
          if [[ "${{ github.ref_name }}" == "staging" ]]; then
            flutter build apk --debug --project-name="T-Music-Beta"
          else
            flutter build apk --release
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}-${{ github.ref_name }}
          name: ${{ github.ref_name == 'prod' && 'Official Release' || 'Beta Build' }} v1.0.${{ github.run_number }}
          body: |
            Build tự động từ nhánh: ${{ github.ref_name }}
            Mã commit: ${{ github.sha }}
          draft: false
          prerelease: ${{ github.ref_name == 'staging' }}
          files: build/app/outputs/flutter-apk/*.apk

      - name: Cleanup old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const relevant = artifacts.data.artifacts
              .filter(a => a.name.includes(`app-${branch}-`))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            if (relevant.length > 3) {
              for (let i = 3; i < relevant.length; i++) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: relevant[i].id,
                });
              }
            }